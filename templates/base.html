<!doctype html>
<html lang="uk" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Rick and Morty — Каталог персонажів{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-md border-bottom border-success-subtle mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold portal-text" href="{{ url_for('index') }}">
      <i class="bi bi-stars"></i> Rick &amp; Morty
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link {{ 'active' if request.endpoint == 'index' }}" href="{{ url_for('index') }}"><i class="bi bi-search"></i> Пошук</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if request.endpoint in ('saved', 'detail', 'edit') }}" href="{{ url_for('saved') }}"><i class="bi bi-collection"></i> Моя колекція</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if request.endpoint == 'stats' }}" href="{{ url_for('stats') }}"><i class="bi bi-bar-chart"></i> Аналіз</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="container pb-5">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>

<footer class="text-center text-secondary small py-4 border-top border-secondary-subtle">
  Дані: <a href="https://rickandmortyapi.com/" target="_blank" rel="noopener">rickandmortyapi.com</a> ·
  Власний REST API: <code>/api/characters</code>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
